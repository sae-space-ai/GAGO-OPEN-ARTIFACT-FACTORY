<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GAGO Open Artifact Factory - Factoría abierta de artefactos digitales y aplicaciones de inteligencia artificial" />
    <title>GAGO Open Artifact Factory</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.dark, html.dark body { background-color: #0f172a; color: #e2e8f0; }
      html.light, html.light body { background-color: #f8fafc; color: #1e293b; }
    </style>
    <script>
      (function() {
        const saved = localStorage.getItem('gago-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
