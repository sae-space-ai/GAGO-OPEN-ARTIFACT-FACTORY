name: CalculadoraPresupuestosJOULE Vite
on:
  push:
    paths:
      - 'apps/CalculadoraPresupuestosJOULE/**'
      - '.github/workflows/calculadora-joule.yml'
  pull_request:
    paths:
      - 'apps/CalculadoraPresupuestosJOULE/**'
      - '.github/workflows/calculadora-joule.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/CalculadoraPresupuestosJOULE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
